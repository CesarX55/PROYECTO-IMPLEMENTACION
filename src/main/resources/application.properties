spring.application.name=bibliotec
server.port=8080

# Base de datos H2 en archivo (se conserva entre reinicios)
spring.datasource.url=jdbc:h2:file:./data/bibliotec
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT: usa la variable de entorno JWT_SECRET si existe; si no, el valor de desarrollo.
# Para generar uno propio: openssl rand -base64 32
jwt.secret=${JWT_SECRET:6AM1tSaEPXrHxAPzd6TFUUVX0vDnw2FFz7r7C/RkRho=}
jwt.expiration-ms=3600000

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
